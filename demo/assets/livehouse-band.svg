<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".22" stop-color="white" stop-opacity=".5"/>
      <stop offset=".5" stop-color="white" stop-opacity=".94"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="66%" cy="42%" r="68%">
      <stop offset="0" stop-color="#f13030" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#b50712" stop-opacity=".88"/>
      <stop offset=".8" stop-color="#3b0207" stop-opacity=".42"/>
      <stop offset="1" stop-color="#080606" stop-opacity="0"/>
