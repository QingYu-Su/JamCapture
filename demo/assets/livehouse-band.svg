      <stop offset=".92" stop-color="#b50812" stop-opacity=".72"/>
      <stop offset="1" stop-color="#120103" stop-opacity=".2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
