<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" aria-hidden="true">
  <defs>
    <radialGradient id="glowA" cx="72%" cy="32%" r="58%">
      <stop offset="0" stop-color="#ff543f" stop-opacity=".9"/>
      <stop offset=".28" stop-color="#c51627" stop-opacity=".62"/>
      <stop offset=".68" stop-color="#4a0711" stop-opacity=".24"/>
      <stop offset="1" stop-color="#070606" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="72%" r="48%">
      <stop offset="0" stop-color="#d92f25" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#8e0f1c" stop-opacity=".34"/>
      <stop offset="1" stop-color="#060505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0" x2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white" stop-opacity=".28"/>
      <stop offset=".5" stop-color="white" stop-opacity=".9"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0" x2="1">
      <stop offset="0" stop-color="#c92e34" stop-opacity="0"/>
      <stop offset=".36" stop-color="#e84245" stop-opacity=".45"/>
      <stop offset=".72" stop-color="#ff6b55" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9f1c28" stop-opacity=".22"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
    </filter>
    <mask id="fadeMask"><rect width="1200" height="720" fill="url(#leftFade)"/></mask>
  </defs>

  <g mask="url(#fadeMask)">
    <ellipse cx="820" cy="250" rx="420" ry="275" fill="#d31b27" opacity=".28" filter="url(#blurGlow)"/>
    <rect width="1200" height="720" fill="url(#glowA)"/>
    <rect width="1200" height="720" fill="url(#glowB)"/>

    <g fill="none" stroke="url(#waveStroke)" stroke-linecap="round">
      <path d="M72 412C174 398 215 338 308 354c105 18 115 128 223 132 116 4 126-159 245-157 116 2 153 145 275 116 47-11 76-47 107-88" stroke-width="2.2" opacity=".78"/>
      <path d="M31 448c100-15 168-80 264-63 103 19 124 108 220 119 127 15 159-139 275-130 111 8 149 126 276 98 49-11 86-49 122-92" stroke-width="1.25" opacity=".52"/>
      <path d="M96 367c90-6 139-61 225-50 112 15 133 124 235 122 116-2 141-158 260-146 109 11 148 129 260 92 37-12 68-39 94-73" stroke-width="1" opacity=".38"/>
      <path d="M194 513c77-10 132-55 202-38 81 20 96 93 175 104 105 15 151-108 244-93 82 13 115 94 209 76 49-9 90-39 133-84" stroke-width=".8" opacity=".26"/>
    </g>

